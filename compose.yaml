services:
  dark-triage:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # Only needed for the first start (empty database); ignored afterwards.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Empty: SQLite in the triage-data volume. Set to use PostgreSQL instead (see README).
      DATABASE_URL: ${DATABASE_URL:-}
    volumes:
      - triage-data:/app/data
volumes:
  triage-data:
